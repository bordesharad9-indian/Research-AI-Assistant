
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
        }

        h1 {
            color: #1e40af;
            text-align: center;
        }

        .section {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        input {
            padding: 12px;
            width: 95%;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #answer, #status {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Research Assistant</h1>

    <p style="text-align:center">
        Machine Learning | NLP | Deep Learning |
        Random Forest | RAG
    </p>

    <div class="section">
        <h3>1. Upload PDF Documents</h3>

        <input type="file" id="pdfFile" accept=".pdf">

        <button onclick="uploadPDF()">Upload PDF</button>
    </div>

    <div class="section">
        <h3>2. Document Ingestion</h3>

        <button onclick="ingestPDF()">Start Ingestion</button>

        <div id="status"></div>
    </div>

    <div class="section">
        <h3>3. Ask Research Questions</h3>

        <input
            type="text"
            id="query"
            placeholder="Enter your research question..."
        >

        <button onclick="askQuestion()">Ask Question</button>

        <h3>Generated Answer</h3>

        <div id="answer">Your answer will appear here.</div>
    </div>

</div>

<script>

async function uploadPDF() {

    const file = document.getElementById("pdfFile").files[0];

    if (!file) {
        alert("Please select a PDF file.");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    const status = document.getElementById("status");
    status.innerText = "Uploading PDF...";

    try {
        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail);

        status.innerText = data.message;

    } catch (error) {
        status.innerText = "Error: " + error.message;
    }
}


async function ingestPDF() {

    const status = document.getElementById("status");
    status.innerText = "Processing PDF documents...";

    try {
        const response = await fetch("/ingest", {
            method: "POST"
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail);

        status.innerText = data.message;

    } catch (error) {
        status.innerText = "Error: " + error.message;
    }
}


async function askQuestion() {

    const query = document.getElementById("query").value.trim();
    const answer = document.getElementById("answer");

    if (!query) {
        alert("Please enter a question.");
        return;
    }

    answer.innerText = "Generating answer...";

    try {
        const response = await fetch("/query", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                query: query,
                top_k: 5
            })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail);

        answer.innerText = data.answer;

    } catch (error) {
        answer.innerText = "Error: " + error.message;
    }
}

</script>

</body>
</html>
